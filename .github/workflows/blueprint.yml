# Build the Verso blueprint in `blueprint/` and publish it with GitHub Pages.
# Adapted from the verso-blueprint project template (branch v4.34.0).
#
# Pages must be enabled once in the repository settings, with "GitHub Actions" as the source.
# (`enablement: true` below can enable Pages by itself only when configure-pages is given a token
# other than the default GITHUB_TOKEN; with Pages already enabled it does nothing.)
# Pull requests only build the site; pushes to main and manual runs also deploy it.
name: Blueprint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-blueprint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: blueprint

jobs:
  build:
    name: Build blueprint site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # The installer script is pinned to the commit of elan release v4.2.4; it installs the
      # current elan release, which then installs the toolchain pinned in `lean-toolchain`.
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Verso package builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            blueprint/.lake/packages/VersoBlueprint
            blueprint/.lake/packages/verso
            blueprint/.lake/packages/subverso
            blueprint/.lake/packages/verso-slides
            blueprint/.lake/packages/illuminate
            blueprint/.lake/packages/MD4Lean
          key: ${{ runner.os }}-blueprint-packages-v1-${{ hashFiles('blueprint/lean-toolchain', 'blueprint/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-blueprint-packages-v1-

      - name: Show tool versions
        run: |
          lean --version
          lake --version

      # Mathlib (and its dependencies) always come from the Mathlib build cache.
      - name: Fetch the Mathlib build cache
        run: lake exe cache get

      - name: Build the blueprint site
        run: ./scripts/ci-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: blueprint/_out/site/html-multi

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
