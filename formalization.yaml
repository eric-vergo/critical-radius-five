# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (Mathlib Initiative project card, in the layout of the Palomar registry
# template). Kernel facts below (sorry counts, axioms) are those printed by `lake build Test`,
# which fails if they change.
version: "v0.4"

project:
  name: "critical-radius-five"
  description: >-
    A formal proof, in Lean 4 with Mathlib, that the two-disk compound symmetry group GG_5(r) --
    generated by the clockwise turns by 2π/5 of two closed disks of radius r centred at -1 and 1
    in the complex plane -- is finite if and only if r < √(3 + φ), where φ is the golden ratio.
    Hence its critical radius is r_c(5) = √(3 + φ) = 2.1489611..., the value found numerically by
    Hearn, Kretschmer, Rokicki, Streeter and Vergo. The upper bound is their Theorem 2: at
    √(3 + φ) three words act on a chord as an interval exchange with irrational rotation number
    1/φ. The lower bound traps every orbit below √(3 + φ) in a bounded set of ℤ[ζ₅], using the
    cut levels of a lattice functional under the golden rotation and a lens bound.
  authors:
    - "The critical-radius-five authors"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The critical-radius-five authors"

classification:
  arxiv: ["math.GR", "math.MG"]
  msc2020: ["20B07", "37E05", "37E10", "11R18"]

sources:
  - title: "The critical radius of GG_5 (both halves), first presented in this formalization"
    type: original-proof
    relationship: other
    note: >-
      The equality r_c(5) = √(3 + φ), and in particular the finiteness of GG_5(r) for every
      r < √(3 + φ), is proved here; the source below proves the upper bound and conjectures the
      value.
  - title: "Two-Disk Compound Symmetry Groups"
    authors:
      - "Robert A. Hearn"
      - "William Kretschmer"
      - "Tomas Rokicki"
      - "Benjamin Streeter"
      - "Eric Vergo"
    id: "arXiv:2302.12950"
    type: paper
    location: "Theorem 2 (GG_5 is infinite at √(3 + φ)); table of numerical critical radii"
    relationship: background
    note: >-
      Theorem 2 is formalized as CriticalRadiusFive.infinite_GG_five, following the paper's
      three-piece interval exchange on the chord E'E; the definitions of the groups and of the
      critical radius follow the paper's conventions (closed disks, clockwise turns).
    license: "arXiv non-exclusive license"
    author_endorsement: participated

related_formalizations: []

status:
  scope: >-
    Complete for n = 5: Finite (GG 5 r) ↔ r < √(3 + φ) for every real r, and
    criticalRadius 5 = √(3 + φ). The groups GG n r and criticalRadius n are defined for every n;
    general results proved for every n are the bounded-orbits criterion for finiteness, the
    monotonicity of finiteness in r, and the characterisation of the critical radius as a
    threshold. Other values of n are not treated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "criticalRadius_five"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "finite_GG_five_iff"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5", "Claude Fable 5.1"]
      framework: "Claude Code"
      tool_setup: >-
        Lean 4 v4.34.0 and Mathlib through lake; AI agents wrote the Lean development under human
        direction, with the Lean kernel as the only verifier.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine and API"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The mathematics and the Lean proof were developed with AI agents directed by a coauthor of the
    source paper; every claim is checked by the Lean kernel, and the statement is checked against
    Challenge.lean by the comparator with the Lean kernel and the independent nanoda kernel.

fidelity:
  divergences: >-
    The paper's generators are the clockwise turns of closed disks; here they are
    turn (-1) r (-(2π/n)) and turn 1 r (-(2π/n)), where turn c r θ rotates the closed disk of
    radius r about c by the angle θ and fixes every other point. criticalRadius uses Mathlib's
    sSup, which is 0 on sets that are empty or unbounded above; the theorem finite_GG_five_iff
    states the result without reference to this convention. Words are read left to right as in
    the paper; this affects only the auxiliary word machinery, not the group.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Machine-checked: lake build (Lean kernel), the axiom audit Test.lean, and the comparator run
    with the Lean kernel and nanoda. The statement surface Challenge.lean depends on Mathlib only
    and repeats the library's definitions verbatim. No human peer review yet.

alignment:
  namespace: "CriticalRadiusFive"
  statements:
    - source: "arXiv:2302.12950, Theorem 2"
      lean: "CriticalRadiusFive.infinite_GG_five"
      module: "CriticalRadiusFive.UpperBound"
      status: "proved"
      note: "GG_5 is infinite at r = √(3 + φ)."
    - source: "arXiv:2302.12950, conjectured value r_c(5) = √(3 + φ) (lower bound new here)"
      lean: "CriticalRadiusFive.finite_GG_five_of_lt"
      module: "CriticalRadiusFive.LowerBound"
      status: "proved"
      note: "GG_5 is finite for every r < √(3 + φ)."
    - source: "arXiv:2302.12950, value of the critical radius for n = 5"
      lean: "criticalRadius_five"
      module: "Solution"
      status: "proved"
      note: "criticalRadius 5 = √(3 + φ); comparator-checked against Challenge.lean."
    - source: "arXiv:2302.12950, value of the critical radius for n = 5"
      lean: "finite_GG_five_iff"
      module: "Solution"
      status: "proved"
      note: "Finite (GG 5 r) ↔ r < √(3 + φ); comparator-checked against Challenge.lean."

acknowledgements: >-
  Mathlib; the Lean FRO comparator, lean4export, the nanoda kernel and landrun; the Palomar
  registry template, from which the verification script and the layout are adapted.
